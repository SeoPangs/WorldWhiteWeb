<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World White Web RPG</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header>
    <h1>World White Web RPG</h1>
    <span class="sep">·</span>
    <span class="small muted">화이트 브라우저 RPG</span>
    <div class="right flex small">
      <label class="flex small" title="자동 저장"><input id="autosave" type="checkbox" checked style="margin-right:6px">자동저장</label>
      <button id="btnExport" class="small">내보내기</button>
      <button id="btnImport" class="small">불러오기</button>
      <button id="btnReset" class="small" title="초기화">새 게임</button>
    </div>
  </header>

  <main class="container">
    <!-- Left: Player -->
    <section class="card" id="panelPlayer">
      <div class="title">Player</div>
      <div class="hpbar" aria-label="HP">
        <i id="hpFill" style="width:100%"></i>
      </div>
      <div class="stats" style="margin-top:8px">
        <div class="stat"><span>레벨</span><b id="lv">1</b></div>
        <div class="stat"><span>경험치</span><b id="xp">0 / 10</b></div>
        <div class="stat"><span>HP</span><b id="hp">10 / 10</b></div>
        <div class="stat"><span>공격력</span><b id="atk">2</b></div>
        <div class="stat"><span>방어력</span><b id="def">1</b></div>
        <div class="stat"><span>골드</span><b id="gold">0</b></div>
      </div>
      <div style="margin-top:10px" class="row">
        <button id="btnRest">휴식(+HP)</button>
        <button id="btnTrain">훈련(+ATK, 소모: 골드)</button>
        <button id="btnGuard">방비(+DEF, 소모: 골드)</button>
      </div>
      <p class="small muted" style="margin-top:6px">휴식 시간에 잠깐씩 눌러도 진도가 나가는 가벼운 구조입니다. 진행 상황은 브라우저에 저장됩니다.</p>
    </section>

    <!-- Middle: Adventure / Combat -->
    <section class="card" id="panelAdventure">
      <div class="title">Adventure</div>
      <div class="row">
        <select id="zoneSelect" title="지역 선택">
          <option value="meadow">초원 (권장: Lv 1~3)</option>
          <option value="forest">숲 (권장: Lv 3~6)</option>
          <option value="ruin">폐허 (권장: Lv 6+)</option>
        </select>
        <button id="btnExplore">탐험 시작/정지</button>
        <span class="small muted" id="tickInfo">1초마다 처리</span>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px">
        <div>
          <div class="title">적</div>
          <div class="card" style="padding:8px">
            <div class="flex"><b id="enemyName">-</b><span class="right small muted" id="enemyLvl">Lv -</span></div>
            <div class="hpbar" style="margin-top:8px"><i id="enemyHpFill" style="width:0%"></i></div>
            <div class="flex small" style="margin-top:6px"><span id="enemyHp">-</span><span class="right muted" id="enemyAtk">ATK - / DEF -</span></div>
            <div class="row" style="margin-top:8px">
              <button id="btnAttack">공격</button>
              <button id="btnAuto" title="자동 전투 토글">자동 전투: <span id="autoState">OFF</span></button>
            </div>
          </div>
        </div>
        <div>
          <div class="title">전투 로그</div>
          <div id="log" class="log mono" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <!-- Right: Upgrades / Options -->
    <aside class="card">
      <div class="title">Upgrades</div>
      <div class="row">
        <button id="btnBuyPotion">포션 구매(5G)</button>
        <button id="btnUsePotion">포션 사용</button>
      </div>
      <ul class="small" id="inv" style="margin-top:8px; padding-left:18px">
        <li class="muted">인벤토리 비어있음</li>
      </ul>
      <div class="title" style="margin-top:12px">메모</div>
      <textarea id="memo" placeholder="메모는 자동 저장됩니다."></textarea>
      <p class="small muted">저장 위치: 이 브라우저(LocalStorage), 오프라인 동작, 네트워크 없음.</p>
    </aside>
  </main>

<script src="scripts/main.js"></script>

</body>
</html>
